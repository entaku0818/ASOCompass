name: Batch Scheduler

on:
  schedule:
    # Run daily at 9:00 JST (0:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        type: choice
        options:
          - all
          - rankings
          - store-rankings
          - tracked-keywords
          - keyword-cache
          - migrate
          - seed

jobs:
  run-batch:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      - name: Build and Push batch image
        working-directory: backend
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          docker build -f Dockerfile.batch \
            -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/batch:${{ github.sha }} \
            -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/batch:latest \
            .
          docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/batch:${{ github.sha }}
          docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/batch:latest

      - name: Create or update Cloud Run Job
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          ADMIN_ASA_CLIENT_ID: ${{ secrets.ADMIN_ASA_CLIENT_ID }}
          ADMIN_ASA_TEAM_ID: ${{ secrets.ADMIN_ASA_TEAM_ID }}
          ADMIN_ASA_KEY_ID: ${{ secrets.ADMIN_ASA_KEY_ID }}
          ADMIN_ASA_PRIVATE_KEY: ${{ secrets.ADMIN_ASA_PRIVATE_KEY }}
          ADMIN_ASA_ORG_ID: ${{ secrets.ADMIN_ASA_ORG_ID }}
        run: |
          # Build base env vars
          ENV_VARS="DATABASE_URL=${{ secrets.DATABASE_URL }},SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}"

          # Append ASA env vars only if secrets are set
          if [ -n "$ADMIN_ASA_CLIENT_ID" ]; then
            ENV_VARS="$ENV_VARS,ADMIN_ASA_CLIENT_ID=$ADMIN_ASA_CLIENT_ID"
            ENV_VARS="$ENV_VARS,ADMIN_ASA_TEAM_ID=$ADMIN_ASA_TEAM_ID"
            ENV_VARS="$ENV_VARS,ADMIN_ASA_KEY_ID=$ADMIN_ASA_KEY_ID"
            ENV_VARS="$ENV_VARS,ADMIN_ASA_PRIVATE_KEY=$ADMIN_ASA_PRIVATE_KEY"
            ENV_VARS="$ENV_VARS,ADMIN_ASA_ORG_ID=$ADMIN_ASA_ORG_ID"
            echo "ASA credentials found, will be passed to Cloud Run job"
          else
            echo "ADMIN_ASA_* secrets not set, keyword-cache job will be skipped by batch"
          fi

          # Check if job exists
          if gcloud run jobs describe aso-batch --region asia-northeast1 --project $PROJECT_ID 2>/dev/null; then
            echo "Updating existing job..."
            # Note: --set-cloudsql-instances is omitted on update to avoid sqladmin API requirement.
            # Cloud SQL connection is already configured on the existing job.
            gcloud run jobs update aso-batch \
              --image asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/batch:${{ github.sha }} \
              --region asia-northeast1 \
              --set-env-vars "$ENV_VARS" \
              --memory 512Mi \
              --cpu 1 \
              --task-timeout 30m \
              --max-retries 0
          else
            echo "Creating new job..."
            gcloud run jobs create aso-batch \
              --image asia-northeast1-docker.pkg.dev/$PROJECT_ID/aso-tool/batch:${{ github.sha }} \
              --region asia-northeast1 \
              --set-cloudsql-instances=$PROJECT_ID:asia-northeast1:aso-db \
              --set-env-vars "$ENV_VARS" \
              --memory 512Mi \
              --cpu 1 \
              --task-timeout 30m \
              --max-retries 0
          fi

      - name: Execute batch job
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          JOB_TYPE: ${{ github.event.inputs.job || 'all' }}
        run: |
          echo "Running batch job: $JOB_TYPE"
          gcloud run jobs execute aso-batch \
            --region asia-northeast1 \
            --args "$JOB_TYPE" \
            --wait

      - name: Summary
        if: always()
        run: |
          echo "## Batch Job Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Job type: ${{ github.event.inputs.job || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Completed at: $(date)" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack on Success
        if: success()
        env:
          JOB_TYPE: ${{ github.event.inputs.job || 'all' }}
          BRANCH_NAME: ${{ github.ref_name }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          CURRENT_TIME=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"✅ ASO Tool バッチジョブ完了\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \"✅ バッチジョブ成功\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*ジョブタイプ:*\n${JOB_TYPE}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*ブランチ:*\n${BRANCH_NAME}\"}
                  ]
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*実行時刻:*\n${CURRENT_TIME}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*ワークフロー:*\n<${WORKFLOW_URL}|詳細を見る>\"}
                  ]
                }
              ]
            }" \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack on Failure
        if: failure()
        env:
          JOB_TYPE: ${{ github.event.inputs.job || 'all' }}
          BRANCH_NAME: ${{ github.ref_name }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          CURRENT_TIME=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"❌ ASO Tool バッチジョブ失敗\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \"❌ バッチジョブ失敗\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*ジョブタイプ:*\n${JOB_TYPE}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*ブランチ:*\n${BRANCH_NAME}\"}
                  ]
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*実行時刻:*\n${CURRENT_TIME}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*ワークフロー:*\n<${WORKFLOW_URL}|詳細を見る>\"}
                  ]
                }
              ]
            }" \
            "$SLACK_WEBHOOK_URL"
